<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chess Around Town</title>
<meta property="og:title" content="Chess Around Town">
<meta property="og:description" content="NYC chess meetups, tournaments, and pickup games.">
<link rel="stylesheet" href="style.css">
<style>
  .card {
    background: #fff;
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 20px;
    margin: 24px 0;
  }
  .card h2 { margin: 0 0 6px; border: none; padding: 0; font-size: 1.3rem; }
  .card .meta { color: var(--muted); margin: 0 0 4px; }
  .card .badge {
    display: inline-block;
    font-size: 0.78rem;
    font-weight: 600;
    color: #b3261e;
    text-decoration: line-through;
    margin-bottom: 6px;
  }
  .cta {
    display: block;
    text-align: center;
    text-decoration: none;
    font-weight: 700;
    padding: 14px 20px;
    border-radius: 10px;
    margin-top: 12px;
  }
  .cta.primary { background: var(--accent); color: #fff; }
  .cta.secondary { background: transparent; color: var(--text); border: 1px solid var(--border); }
  .loading, .error { color: var(--muted); }
  .beta-note {
    font-size: 0.85rem;
    color: var(--muted);
    margin-top: 10px;
    text-align: center;
  }
</style>
</head>
<body>
<main>
  <h1>Chess Around Town</h1>
  <p class="updated">NYC chess meetups, tournaments, and pickup games.</p>

  <div id="content" class="card"><p class="loading">Loading…</p></div>

  <a id="open-app" class="cta primary" href="#">Open in the app</a>
  <p class="beta-note">
    Don't have it yet? Chess Around Town is currently in testing —
    ask whoever sent you this link for a TestFlight invite.
  </p>
</main>
<script>
  const SUPABASE_URL = "https://fumukidrllxkifsjhthi.supabase.co";
  const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZ1bXVraWRybGx4a2lmc2podGhpIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODgzMDc4ODEsImV4cCI6MjEwMzg4Mzg4MX0.sewKxN_pW7h2s-nlnUK52_zx75kuuFPcbLBG8l10JC8";

  const params = new URLSearchParams(location.search);
  const type = params.get("type");
  const id = params.get("id");
  const contentEl = document.getElementById("content");
  const openAppEl = document.getElementById("open-app");

  function esc(s) {
    const d = document.createElement("div");
    d.textContent = s ?? "";
    return d.innerHTML;
  }

  function fmtDateTime(dateStr, timeStr) {
    try {
      const d = new Date(`${dateStr}T${timeStr || "00:00"}`);
      return d.toLocaleDateString(undefined, { weekday: "long", month: "long", day: "numeric" }) +
        (timeStr ? " · " + d.toLocaleTimeString(undefined, { hour: "numeric", minute: "2-digit" }) : "");
    } catch {
      return dateStr;
    }
  }

  async function sb(path) {
    const res = await fetch(`${SUPABASE_URL}/rest/v1/${path}`, {
      headers: { apikey: SUPABASE_ANON_KEY, Authorization: `Bearer ${SUPABASE_ANON_KEY}` },
    });
    if (!res.ok) throw new Error("Request failed");
    return res.json();
  }

  async function load() {
    if (!type || !id || !["plan", "event", "location", "user"].includes(type)) {
      contentEl.innerHTML = '<p class="error">This link is missing some details.</p>';
      openAppEl.href = "chessaroundtown://";
      return;
    }

    openAppEl.href = `chessaroundtown://${type}/${encodeURIComponent(id)}`;

    try {
      if (type === "plan") {
        const rows = await sb(`plans?id=eq.${id}&select=plan_date,start_time,end_time,is_cancelled,location:locations(name,address)`);
        const p = rows[0];
        if (!p) throw new Error("not found");
        contentEl.innerHTML = `
          <h2>${esc(p.location?.name ?? "A chess proposal")}</h2>
          <p class="meta">${esc(fmtDateTime(p.plan_date, p.start_time))}</p>
          ${p.location?.address ? `<p class="meta">${esc(p.location.address)}</p>` : ""}
        `;
      } else if (type === "event") {
        const rows = await sb(`events?id=eq.${id}&select=title,description,start_at,status,location:locations(name,address)`);
        const e = rows[0];
        if (!e) throw new Error("not found");
        const d = new Date(e.start_at);
        contentEl.innerHTML = `
          ${e.status === "cancelled" ? '<div class="badge">This event was cancelled</div>' : ""}
          <h2>${esc(e.title)}</h2>
          <p class="meta">${esc(d.toLocaleDateString(undefined, { weekday: "long", month: "long", day: "numeric" }))} ·
            ${esc(d.toLocaleTimeString(undefined, { hour: "numeric", minute: "2-digit" }))}</p>
          ${e.location?.name ? `<p class="meta">${esc(e.location.name)}${e.location.address ? " · " + esc(e.location.address) : ""}</p>` : ""}
        `;
      } else if (type === "location") {
        const rows = await sb(`locations?id=eq.${id}&select=name,address,venue_type`);
        const l = rows[0];
        if (!l) throw new Error("not found");
        contentEl.innerHTML = `
          <h2>${esc(l.name)}</h2>
          <p class="meta">${esc(l.address ?? "")}</p>
        `;
      } else if (type === "user") {
        const rows = await sb(`profiles?username=eq.${encodeURIComponent(id)}&select=display_name,username,bio`);
        const u = rows[0];
        if (!u) throw new Error("not found");
        contentEl.innerHTML = `
          <h2>${esc(u.display_name)}</h2>
          <p class="meta">@${esc(u.username)}</p>
          ${u.bio ? `<p class="meta">${esc(u.bio)}</p>` : ""}
        `;
      }
    } catch {
      contentEl.innerHTML = '<p class="error">This isn\'t available to preview — open the app to see it.</p>';
    }
  }

  load();
</script>
</body>
</html>
